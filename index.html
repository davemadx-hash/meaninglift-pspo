<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f5ef">
<title>MeaningLift Study — PSPO</title>
<style>
:root{--paper:#f7f5ef;--card:#fff;--ink:#17221f;--muted:#65716d;--thread:#19483e;--hair:#dedfd9;--soft:#eaf1ee;--bad:#9d4a36}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}.wrap{max-width:1200px;margin:0 auto;padding:0 1.5rem}header{background:var(--card);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:100}header .bar{display:flex;justify-content:space-between;align-items:center;padding:1rem 0}.logo{font-weight:600;font-size:1.1rem}.logo em{font-style:normal;color:var(--thread)}nav{display:flex;gap:0.5rem}button{border:none;background:0;padding:0.5rem 1rem;cursor:pointer;border-radius:4px;font-size:0.9rem;color:var(--muted);transition:all 0.2s}button:hover{background:var(--soft);color:var(--thread)}button[aria-current="true"]{color:var(--thread);background:var(--soft);font-weight:500}main{padding:2rem 0}section{display:none}section.on{display:block}section.view{margin-bottom:3rem}h1{font-size:1.8rem;margin:0 0 1rem 0;color:var(--ink)}h2{font-size:1.3rem;margin:1.5rem 0 0.75rem 0}p.lead{font-size:1.05rem;color:var(--muted);margin:0 0 1.5rem 0}.pill{display:inline-block;background:var(--soft);color:var(--thread);padding:0.5rem 1rem;border-radius:20px;font-size:0.9rem;font-weight:500;margin-bottom:1.5rem}.stat{display:inline-block;margin-right:2rem;margin-bottom:0.75rem}.stat strong{color:var(--thread);font-size:1.3rem;display:block}.stat span{font-size:0.9rem;color:var(--muted)}.qbox{background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:1.5rem;margin:2rem 0}.qbox span{display:block;color:var(--muted);font-size:0.85rem;margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.5px}.qbox h3{margin:0 0 1.5rem 0;font-size:1.1rem}.opt{display:block;width:100%;text-align:left;padding:1rem;margin:0.75rem 0;background:var(--soft);border:2px solid var(--hair);border-radius:4px;cursor:pointer;font-size:0.95rem;transition:all 0.2s}.opt:hover:not(:disabled){background:#dfe8e3;border-color:var(--thread)}.opt.sel{border-color:var(--thread);background:var(--thread);color:var(--card);font-weight:500}.opt:disabled{cursor:not-allowed;opacity:0.7}.btn{background:var(--thread);color:var(--card);border:none;padding:0.75rem 1.5rem;border-radius:4px;cursor:pointer;font-size:0.95rem;font-weight:500;transition:all 0.2s;margin:1rem 0}.btn:hover{opacity:0.9}.barline{display:flex;justify-content:space-between;align-items:center;padding:0.75rem 0;border-bottom:1px solid var(--hair)}.barline span:first-child{flex:1}.barline span:last-child{color:var(--muted);font-size:0.9rem}.bar-fill{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:0 1rem}.bar-inner{height:100%;background:var(--thread);transition:width 0.3s}.module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem;margin:1.5rem 0}.module-card{background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:1.5rem}.module-card h3{margin:0 0 0.75rem 0;font-size:1rem;color:var(--thread)}.module-card p{margin:0;font-size:0.9rem;color:var(--muted)}.progress-grid{margin:1.5rem 0}.exam-history{margin:1.5rem 0}.exam-record{background:var(--soft);padding:1rem;border-radius:4px;margin-bottom:0.75rem;font-size:0.9rem}.exam-record strong{color:var(--thread)}.footer{background:var(--card);border-top:1px solid var(--hair);margin-top:3rem;padding:1.5rem 0;text-align:center;color:var(--muted);font-size:0.85rem}
</style>
</head>
<body>
<header><div class="wrap bar"><div class="logo">Meaning<em>Lift</em> Study</div><nav><button data-v="today" aria-current="true">Today</button><button data-v="path">Path</button><button data-v="plan">Plan</button><button data-v="exam">Exam</button></nav></div></header>
<main><div class="wrap"><section class="view on" id="today"></section><section class="view" id="path"></section><section class="view" id="plan"></section><section class="view" id="exam"></section></div></main>
<footer class="footer"><div class="wrap">MeaningLift Study · retrieval practice, adaptive review and exam readiness · unofficial PSPO study aid · aligned to Scrum Guide 2020 concepts · not affiliated with Scrum.org</div></footer>
<script>
const MODULES=[['po','Product Owner accountability'],['team','Scrum Team'],['events','Sprint and Scrum events'],['artifacts','Artifacts and commitments'],['backlog','Product Backlog management'],['goal','Product Goal'],['value','Evidence-Based Management'],['stake','Stakeholder engagement'],['forecast','Release forecasting']];
const Q=[
['q1','po','What is the Product Owner accountable for?',['Maximizing the value of the product resulting from the work of the Scrum Team','Assigning work to Developers','Facilitating every Scrum event','Managing the Scrum Master'],0,'The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team. They do not assign work or manage other Scrum Team members.'],
['q2','po','Which statement about delegating Product Backlog management is correct?',['The Product Owner may delegate the work but remains accountable','Accountability transfers to the person doing the work','Delegation eliminates the need for a Product Owner','The Scrum Master must approve all delegated work'],0,'The Product Owner may delegate the work of managing the Product Backlog but is not relieved of the accountability.'],
['q3','team','Which three accountabilities exist within a Scrum Team?',['Product Owner, Scrum Master, Developers','Project Manager, Product Owner, Developers','Sponsor, Scrum Master, Analysts','Product Lead, Tech Lead, Stakeholders'],0,'A Scrum Team consists of one Product Owner, one Scrum Master, and Developers. There are no other roles.'],
['q4','team','Who is responsible for creating a usable Increment each Sprint?',['The Developers','The Product Owner alone','The Scrum Master','Stakeholders'],0,'Developers are accountable for creating an Increment of value each Sprint.'],
['q5','events','What is the purpose of the Daily Scrum?',['Inspect progress toward the Sprint Goal and adapt the Sprint Backlog','Report status to the Product Owner','Estimate the Product Backlog','Discuss technical implementation details'],0,'The Daily Scrum is a 15-minute event for Developers to inspect progress toward the Sprint Goal and adapt the Sprint Backlog.'],
['q6','events','What is the maximum timebox for a Sprint Review for a one-month Sprint?',['4 hours','8 hours','3 hours','1 day'],0,'The Sprint Review is timeboxed to a maximum of four hours for a one-month Sprint.'],
['q7','artifacts','Which commitment belongs to the Product Backlog?',['Product Goal','Sprint Goal','Definition of Done','Release Goal'],0,'The Product Goal is the commitment for the Product Backlog.'],
['q8','artifacts','Which commitment belongs to the Increment?',['Definition of Done','Product Goal','Sprint Goal','Acceptance criteria'],0,'The Definition of Done is the commitment for the Increment.'],
['q9','backlog','Who is accountable for ordering Product Backlog items?',['The Product Owner','The Scrum Master','Developers collectively','Stakeholders'],0,'Ordering the Product Backlog is part of Product Backlog management and is the Product Owner's accountability.'],
['q10','backlog','When is Product Backlog refinement performed?',['As an ongoing activity as needed','Only during Sprint Planning','Only after Sprint Review','Once per Sprint at a fixed event'],0,'Product Backlog refinement is an ongoing activity, not restricted to specific times.'],
['q11','goal','What does the Product Goal describe?',['A future state of the product that can serve as a target for the Scrum Team','The work selected for the current Sprint','The Definition of Done','The quarterly business objectives'],0,'The Product Goal describes a future state of the product that can serve as a target for the Scrum Team to plan against.'],
['q12','goal','Can a Scrum Team take on a new Product Goal before fulfilling or abandoning the current one?',['No','Yes, whenever stakeholders request it','Yes, if the Sprint Goal is met','Only with Scrum Master approval'],0,'Only one Product Goal exists at a time. A new one cannot be adopted until the current one is fulfilled or abandoned.'],
['q13','value','Which Evidence-Based Management Key Value Area asks what value customers experience today?',['Current Value','Unrealized Value','Ability to Innovate','Time-to-Market'],0,'Current Value is the key value area for what value customers experience today.'],
['q14','value','Which EBM Key Value Area concerns the ability to deliver new capabilities that might better meet customer needs?',['Ability to Innovate','Current Value','Unrealized Value','Time-to-Market'],0,'Ability to Innovate concerns the ability to deliver new capabilities.'],
['q15','stake','What should happen in the Sprint Review?',['The Scrum Team and stakeholders inspect the outcome and adapt what to do next','The Product Owner accepts or rejects work','Developers report individual achievements','Stakeholders vote on backlog items'],0,'In the Sprint Review, the Scrum Team and stakeholders inspect the outcome of the Sprint and determine adaptations.'],
['q16','stake','Who may cancel a Sprint?',['The Product Owner','The Scrum Master','Any stakeholder','The Developers'],0,'Only the Product Owner has the authority to cancel the Sprint.'],
['q17','forecast','What is a forecast in Scrum?',['A prediction based on what is known, not a guarantee','A commitment that all selected work will be completed','A fixed release contract','A mandatory estimate'],0,'A forecast is a prediction based on what is known, not a guarantee.'],
['q18','forecast','What is the best basis for release decisions?',['Evidence about value, risk, progress and market context','Velocity alone','Completing every original roadmap item','A predetermined schedule'],0,'Release decisions should be based on evidence about value, risk, progress, and market context.']
].map(x=>({id:x[0],m:x[1],q:x[2],c:x[3],k:x[4],why:x[5]}));
const KEY='meaninglift-pspo-v21',DAY=86400000;let st;try{st=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){st=null}if(!st)st={seen:{},correct:{},due:{},lastSeen:{},attempts:{},sessions:[],exams:[]};function save(){localStorage.setItem(KEY,JSON.stringify(st))}function mastery(q){let c=st.correct[q.id]||0,s=st.seen[q.id]||0;return s?c/s:0}function ready(){return Q.reduce((n,q)=>n+(mastery(q)>=0.8?1:0),0)}function sh(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pct(a,b){return Math.round(a/b*100)}function setViewBare(v){document.querySelectorAll('nav button').forEach(b=>b.removeAttribute('aria-current'));document.querySelector(`nav [data-v="${v}"]`).setAttribute('aria-current','true');document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));document.getElementById(v).classList.add('on')}
function today(){let r=ready(),due=Q.filter(q=>(st.due[q.id]||0)<=Date.now()&&(st.seen[q.id]||0)>0).length;document.getElementById('today').innerHTML=`<span class="pill">Adaptive PSPO prep</span><p class="lead">Spaced retrieval practice. Questions are selected based on what you need to review.</p><div class="stat"><strong>${r}/${Q.length}</strong><span>ready for certification</span></div><div class="stat"><strong>${due}</strong><span>due for review today</span></div><button class="btn" onclick="start('study',5)">Start adaptive session (5 questions)</button><button class="btn" onclick="start('study',10)">Start adaptive session (10 questions)</button>`}
function path(){document.getElementById('path').innerHTML=`<h1>Learning path</h1><p class="lead">Nine knowledge areas. Progress reflects demonstrated recall, not content viewed.</p>`+MODULES.map(m=>{let qs=Q.filter(q=>q.m===m[0]),p=Math.round(qs.reduce((s,q)=>s+mastery(q),0)/qs.length);return `<div class="module-card"><h3>${m[1]}</h3><p>${qs.length} questions</p><div class="bar-fill"><div class="bar-inner" style="width:${p}%"></div></div><p style="margin-top:0.75rem;font-size:0.85rem;color:var(--muted);">${p}% mastery</p></div>`}).join('')}
function plan(){let s=[['1 · Framework, cold','Read the Scrum Guide end-to-end. Take a diagnostic without preparation. Focus: Scrum Team + events.'],['2 · Accountability + backlog','Recite the Product Owner accountabilities from memory. Review: Product Backlog management + Product Goal.'],['3 · Artifacts + Value','Summarize each artifact and its commitment. Review: EBM Key Value Areas + stakeholder engagement.'],['4 · Spacing protocol','Correct: reviewed in 2 days. Incorrect: reviewed after 1 intervening question. Wrong answers are never repeated immediately.'],['5 · Exam simulation','Complete a full practice exam (20 questions, no review). Score ≥80% to simulate readiness.']];document.getElementById('plan').innerHTML=`<h1>Study plan</h1><p class="lead">A structured path designed for the PSPO exam.</p>`+s.map((x,i)=>`<h2>${x[0]}</h2><p>${x[1]}</p>`).join('')}
let sess=null;
function adaptive(n){
  let now=Date.now();
  let sessionIds=new Set(sess.list.map(q=>q.id));
  return Q.slice().filter(q=>!sessionIds.has(q.id)).sort((a,b)=>{
    let aDue=st.due[a.id]||0,bDue=st.due[b.id]||0;
    let aSeenEver=st.seen[a.id]||0,bSeenEver=st.seen[b.id]||0;
    let aEligible=aDue<=now,bEligible=bDue<=now;
    if(aEligible!==bEligible)return aEligible?-1:1;
    if(aSeenEver===0&&bSeenEver>0)return-1;
    if(bSeenEver===0&&aSeenEver>0)return 1;
    return mastery(a)-mastery(b);
  }).slice(0,n);
}
function start(type,n){
  sess={type,list:type==='study'?adaptive(n):Q.slice().sort(()=>Math.random()-0.5),i:0,right:0,skipped:0,sessionQuestions:new Set()};
  sess.list.forEach(q=>sess.sessionQuestions.add(q.id));
  paint();
}
function paint(){let q=sess.list[sess.i],v=sess.type==='exam'?'exam':'today';setViewBare(v);let t=document.getElementById(v),order=sh(q.c.map((_,i)=>i));t.innerHTML=`<div class="qbox"><span class="qnum">${q.m.toUpperCase()} · Q${sess.i+1}/${sess.list.length}</span><h3>${q.q}</h3></div><div id="opts"></div><div id="feed"></div>`;let o=document.getElementById('opts');order.forEach(i=>{let btn=document.createElement('button');btn.className='opt';btn.textContent=q.c[i];btn.onclick=()=>answer(i,btn,q);o.appendChild(btn)})}
function answer(idx,b,q){
  document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  b.classList.add('sel');
  let ok=idx===q.k;
  sess.right+=ok?1:0;
  st.seen[q.id]=(st.seen[q.id]||0)+1;
  st.attempts[q.id]=(st.attempts[q.id]||0)+1;
  st.lastSeen[q.id]=Date.now();
  if(ok){
    st.correct[q.id]=(st.correct[q.id]||0)+1;
    st.due[q.id]=Date.now()+(2*DAY);
  }else{
    st.due[q.id]=Date.now()+(1*DAY);
  }
  save();
  let feed=document.getElementById('feed');
  feed.innerHTML=`<div style="margin-top:1rem;padding:1rem;background:${ok?'#eef5f0':'#fae8e3'};border-radius:4px;border-left:4px solid ${ok?'var(--thread)':'var(--bad)'}"><p style="margin:0;font-weight:500;color:${ok?'var(--thread)':'var(--bad)'}">${ok?'Correct!':'Incorrect.'}</p><p style="margin:0.5rem 0 0 0;color:var(--muted);font-size:0.9rem">${q.why}</p></div>`;
  document.querySelector('.qbox').innerHTML+=`<button class="btn" onclick="next()">Next question</button>`;
}
function next(){
  sess.i++;
  if(sess.i>=sess.list.length){
    finish();
  }else{
    paint();
  }
}
function finish(){let p=pct(sess.right,sess.list.length);if(sess.type==='exam')st.exams.push({d:Date.now(),pct:p,n:sess.list.length});else st.sessions.push({d:Date.now(),pct:p,n:sess.list.length});save();let v=sess.type==='exam'?'exam':'today';setViewBare(v);let t=document.getElementById(v);t.innerHTML=`<div class="qbox" style="text-align:center"><h2>Session complete</h2><p style="font-size:2rem;color:var(--thread);font-weight:600;margin:1rem 0">${p}%</p><p style="color:var(--muted);margin-bottom:1.5rem">${sess.right}/${sess.list.length} correct</p><button class="btn" onclick="setViewBare('today');today()">Return to dashboard</button></div>`;sess=null}
function exam(){let best=st.exams.length?Math.max(...st.exams.map(e=>e.pct)):null;document.getElementById('exam').innerHTML=`<h1>Exam practice</h1><p class="lead">Test recall under exam-style conditions: 20 questions, no review between items.</p><button class="btn" onclick="start('exam',20)">Start exam simulation (20 questions)</button>`+(best?`<div style="margin-top:2rem;background:var(--soft);padding:1.5rem;border-radius:8px"><p style="margin:0;color:var(--muted)">Best exam score</p><p style="margin:0.5rem 0 0 0;font-size:1.5rem;color:var(--thread);font-weight:600">${best}%</p></div>`:'')+`<div style="margin-top:2rem"><h3>Exam history</h3>`+(st.exams.length?st.exams.slice().reverse().map(e=>`<div class="exam-record"><strong>${pct(e.pct)}%</strong> · ${e.n} questions · ${new Date(e.d).toLocaleDateString()}</div>`).join(''):'<p style="color:var(--muted)">No exam attempts yet.</p>')+`</div>`}
function progress(){let r=ready(),rows=MODULES.map(m=>{let qs=Q.filter(q=>q.m===m[0]),p=Math.round(qs.reduce((s,q)=>s+mastery(q),0)/qs.length);return `<div class="barline"><span>${m[1]}</span><span>${p}%</span><div class="bar-fill"><div class="bar-inner" style="width:${p}%"></div></div></div>`}).join('');document.getElementById('path').innerHTML=`<h1>Learning progress</h1><p class="lead">${r}/${Q.length} at ≥80% mastery</p><div class="progress-grid">${rows}</div>`}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{let v=b.dataset.v;setViewBare(v);(v==='today'?today:v==='path'?path:v==='plan'?plan:exam)()});
today();
</script>
</body>
</html>
