<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f5ef">
<title>MeaningLift Study — PSPO</title>
<style>
:root{--paper:#f7f5ef;--card:#fff;--ink:#17221f;--muted:#65716d;--thread:#19483e;--hair:#dedfd9;--soft:#eaf1ee;--bad:#9d4a36}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}button{font:inherit;touch-action:manipulation}.wrap{max-width:920px;margin:auto;padding:0 18px}header{position:sticky;top:0;z-index:20;background:rgba(247,245,239,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);padding-top:env(safe-area-inset-top)}.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:64px}.logo{font-weight:800;font-size:18px;white-space:nowrap}.logo em{color:var(--thread);font-style:normal}nav{display:flex;gap:3px;overflow-x:auto;-webkit-overflow-scrolling:touch}nav button{border:0;background:transparent;padding:10px 11px;border-radius:9px;color:var(--muted);min-height:44px}nav button[aria-current="true"]{background:var(--soft);color:var(--thread);font-weight:700}main{padding:28px 0 70px}.view{display:none}.view.on{display:block}h1{font-size:clamp(30px,5vw,48px);line-height:1.05;margin:10px 0 12px}h2{font-size:22px;margin:30px 0 12px}p{line-height:1.55}.lead{font-size:18px;color:#45514d;max-width:680px}.card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn{border:0;background:var(--thread);color:white;border-radius:11px;padding:13px 16px;min-height:48px;font-weight:700;cursor:pointer}.btn.ghost{background:white;color:var(--thread);border:1px solid var(--hair)}.pill{display:inline-flex;border-radius:999px;background:var(--soft);padding:7px 10px;color:var(--thread);font-size:13px;font-weight:700}.muted{color:var(--muted)}.progress{height:9px;background:#ecece7;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--thread);width:0}.module{display:flex;justify-content:space-between;gap:12px;align-items:center}.module strong{display:block}.num{font-variant-numeric:tabular-nums}.qbox{max-width:760px}.question{font-size:25px;line-height:1.22;font-weight:750;margin:16px 0}.opts{display:grid;gap:9px}.opt{text-align:left;background:white;border:1px solid var(--hair);border-radius:12px;padding:15px;min-height:50px;color:var(--ink)}.opt.sel{border-color:var(--thread);background:var(--soft)}.feedback{border-left:4px solid var(--thread);padding:12px 14px;background:var(--soft);margin-top:14px;border-radius:8px}.feedback.bad{border-color:var(--bad);background:#f6eae6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.score{font-size:56px;font-weight:800;line-height:1}.barline{display:grid;grid-template-columns:minmax(130px,1fr) 2fr 52px;gap:10px;align-items:center;margin:11px 0}.track{height:8px;background:#ecece7;border-radius:99px;overflow:hidden}.track i{height:100%;display:block;background:var(--thread)}footer{border-top:1px solid var(--hair);padding:22px 0 42px;font-size:12.5px;color:var(--muted)}@media(max-width:650px){.bar{display:block;padding:10px 0 7px}.logo{padding:3px 3px 7px}nav{width:100%}nav button{flex:1 0 auto;padding:8px 9px;font-size:13px}main{padding-top:18px}.question{font-size:22px}.barline{grid-template-columns:1fr 48px}.barline .track{grid-column:1/-1;grid-row:2}}
</style>
</head>
<body>
<header><div class="wrap bar"><div class="logo">Meaning<em>Lift</em> Study</div><nav><button data-v="today" aria-current="true">Today</button><button data-v="path">Path</button><button data-v="plan">Plan</button><button data-v="exam">Exam</button><button data-v="progress">Progress</button></nav></div></header>
<main><div class="wrap"><section class="view on" id="today"></section><section class="view" id="path"></section><section class="view" id="plan"></section><section class="view" id="exam"></section><section class="view" id="progress"></section></div></main>
<footer><div class="wrap">MeaningLift Study · retrieval practice, adaptive review and exam readiness · unofficial PSPO study aid · aligned to Scrum Guide 2020 concepts · not affiliated with Scrum.org</div></footer>
<script>
const MODULES=[['po','Product Owner accountability'],['team','Scrum Team'],['events','Sprint and Scrum events'],['artifacts','Artifacts and commitments'],['backlog','Product Backlog management'],['goal','Product vision and Product Goal'],['value','Value and Evidence-Based Management'],['stake','Stakeholders and customers'],['forecast','Forecasting, releasing and strategy']];
const Q=[
['q1','po','What is the Product Owner accountable for?',['Maximizing the value of the product resulting from the work of the Scrum Team','Assigning work to Developers','Facilitating every Scrum event','Approving all technical decisions'],0,'The Product Owner is accountable for maximizing product value and effective Product Backlog management.'],
['q2','po','Which statement about delegating Product Backlog management is correct?',['The Product Owner may delegate the work but remains accountable','Accountability transfers to the person doing the work','Only the Scrum Master may help','It cannot be delegated'],0,'Work may be delegated, but accountability remains with the Product Owner.'],
['q3','team','Which three accountabilities exist within a Scrum Team?',['Product Owner, Scrum Master, Developers','Project Manager, Product Owner, Developers','Sponsor, Scrum Master, Analysts','Product Owner, Architect, Test Lead'],0,'Scrum defines Product Owner, Scrum Master and Developers as the three accountabilities.'],
['q4','team','Who is responsible for creating a usable Increment each Sprint?',['The Developers','The Product Owner alone','The Scrum Master','Stakeholders'],0,'Developers are accountable for creating any aspect of a usable Increment each Sprint.'],
['q5','events','What is the purpose of the Daily Scrum?',['Inspect progress toward the Sprint Goal and adapt the Sprint Backlog','Report status to the Product Owner','Estimate the Product Backlog','Approve completed work'],0,'The Daily Scrum is for Developers to inspect progress toward the Sprint Goal and adapt their plan.'],
['q6','events','What is the maximum timebox for a Sprint Review for a one-month Sprint?',['4 hours','8 hours','3 hours','1 day'],0,'The Sprint Review is timeboxed to a maximum of four hours for a one-month Sprint.'],
['q7','artifacts','Which commitment belongs to the Product Backlog?',['Product Goal','Sprint Goal','Definition of Done','Release Goal'],0,'The Product Goal is the commitment for the Product Backlog.'],
['q8','artifacts','Which commitment belongs to the Increment?',['Definition of Done','Product Goal','Sprint Goal','Acceptance criteria'],0,'The Definition of Done is the commitment for the Increment.'],
['q9','backlog','Who is accountable for ordering Product Backlog items?',['The Product Owner','The Scrum Master','Developers collectively','Stakeholders'],0,'Ordering the Product Backlog is part of effective Product Backlog management, for which the PO is accountable.'],
['q10','backlog','When is Product Backlog refinement performed?',['As an ongoing activity as needed','Only during Sprint Planning','Only after Sprint Review','Once per Sprint at a fixed event'],0,'Refinement is an ongoing activity, not a formal Scrum event.'],
['q11','goal','What does the Product Goal describe?',['A future state of the product that can serve as a target for the Scrum Team','The work selected for the current Sprint','The Definition of Done','A fixed annual delivery plan'],0,'The Product Goal describes a future state of the product and is the long-term objective for the Scrum Team.'],
['q12','goal','Can a Scrum Team take on a new Product Goal before fulfilling or abandoning the current one?',['No','Yes, whenever stakeholders request it','Yes, if the Sprint Goal is met','Only with Scrum Master approval'],0,'The Scrum Team must fulfill or abandon one Product Goal before taking on the next.'],
['q13','value','Which Evidence-Based Management Key Value Area asks what value customers experience today?',['Current Value','Unrealized Value','Ability to Innovate','Time-to-Market'],0,'Current Value focuses on the value delivered to customers and stakeholders today.'],
['q14','value','Which EBM Key Value Area concerns the ability to deliver new capabilities that might better meet customer needs?',['Ability to Innovate','Current Value','Unrealized Value','Time-to-Market'],0,'Ability to Innovate reflects effectiveness in delivering new capabilities that may better meet customer needs.'],
['q15','stake','What should happen in the Sprint Review?',['The Scrum Team and stakeholders inspect the outcome and adapt what to do next','The Product Owner accepts or rejects work','Developers report status to management','Only completed Product Backlog items are discussed'],0,'The Sprint Review is a working session to inspect the outcome with stakeholders and determine future adaptations.'],
['q16','stake','Who may cancel a Sprint?',['The Product Owner','The Scrum Master','Any stakeholder','The Developers'],0,'Only the Product Owner has the authority to cancel the Sprint, typically if the Sprint Goal becomes obsolete.'],
['q17','forecast','What is a forecast in Scrum?',['A prediction based on what is known, not a guarantee','A commitment that all selected work will be completed','A fixed release contract','A mandatory velocity target'],0,'Forecasts reflect what is believed possible with current information; Scrum does not turn uncertain work into guarantees.'],
['q18','forecast','What is the best basis for release decisions?',['Evidence about value, risk, progress and market context','Velocity alone','Completing every original roadmap item','A predetermined date regardless of evidence'],0,'Release decisions should be empirical and value-focused, using evidence rather than a single proxy.']
].map(x=>({id:x[0],m:x[1],q:x[2],c:x[3],k:x[4],why:x[5]}));
const KEY='meaninglift-pspo-v21',DAY=86400000;let st;try{st=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){st=null}if(!st)st={seen:{},correct:{},due:{},sessions:[],exams:[]};function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pct(a,b){return b?Math.round(a/b*100):0}function mn(id){return MODULES.find(m=>m[0]===id)[1]}function mastery(q){let n=st.seen[q.id]||0,c=st.correct[q.id]||0;return n?Math.min(100,Math.round((c/n)*70+Math.min(n,4)/4*30)):0}function ready(){let m=Math.round(Q.reduce((s,q)=>s+mastery(q),0)/Q.length),ex=st.exams.length?st.exams.slice(-2).reduce((s,e)=>s+e.pct,0)/Math.min(2,st.exams.length):null;return ex==null?Math.round(m*.7):Math.round(m*.55+ex*.45)}function setView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v?'true':'false'));render(v);window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));function render(v){({today:today,path:path,plan:plan,exam:exam,progress:progress}[v]||today)()}
function today(){let r=ready(),due=Q.filter(q=>(st.due[q.id]||0)<=Date.now()&&(st.seen[q.id]||0)>0).length;document.getElementById('today').innerHTML=`<span class="pill">Adaptive PSPO prep</span><h1>Study what you're most likely to miss.</h1><p class="lead">MeaningLift diagnoses weak knowledge, brings it back at the right time, and uses exam performance to estimate readiness.</p><div class="grid"><div class="card"><div class="muted">Readiness</div><div class="score">${r}%</div><div class="progress"><i style="width:${r}%"></i></div><p class="muted">${r>=85?'Above the PSPO I pass threshold — keep clearing weak areas.':r>=65?'Building. Mix short review with exam-style practice.':'Early. Start with a diagnostic and let the gaps drive study.'}</p></div><div class="card"><div class="muted">Due for review</div><div class="score">${due}</div><p>${due?'Items are ready to be retrieved again.':'Nothing scheduled yet — start a session.'}</p></div></div><div class="actions"><button class="btn" id="study">Start adaptive study</button><button class="btn ghost" id="diag">10-question diagnostic</button></div>`;study.onclick=()=>start('study',8);diag.onclick=()=>start('exam',10)}
function path(){document.getElementById('path').innerHTML=`<h1>Learning path</h1><p class="lead">Nine knowledge areas. Progress reflects demonstrated recall, not content viewed.</p>`+MODULES.map((m,i)=>{let qs=Q.filter(q=>q.m===m[0]),p=Math.round(qs.reduce((s,q)=>s+mastery(q),0)/qs.length);return `<div class="card module"><div><span class="pill">${i+1} / 9</span><strong>${m[1]}</strong><span class="muted">${qs.length} core checks</span></div><div class="num">${p}%</div></div>`}).join('')}
function plan(){let s=[['1 · Framework, cold','Read the Scrum Guide end-to-end. Take a diagnostic without preparation. Focus: Scrum Team + events.'],['2 · Accountability + backlog','Recite the Product Owner accountability and Product Backlog management responsibilities from memory.'],['3 · Goals + artifacts','Write a real Product Goal. Connect Product Goal, Sprint Goal and Definition of Done to their artifacts.'],['4 · Value + evidence','Learn the four EBM Key Value Areas and connect evidence to product decisions.'],['5 · Stakeholders + simulate','Review stakeholder collaboration, forecasting and release thinking. Then run a timed simulation.']];document.getElementById('plan').innerHTML=`<h1>Five-session plan</h1><p class="lead">Short, retrieval-heavy sessions. If a simulation is below 85%, return to the weakest module rather than restarting the course.</p>`+s.map(x=>`<div class="card"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}
let sess=null;function adaptive(n){let now=Date.now();return Q.slice().filter(q=>{let seen=st.seen[q.id]||0;let due=st.due[q.id]||0;return seen===0||due<=now;}).sort((a,b)=>{let aSeen=st.seen[a.id]||0,bSeen=st.seen[b.id]||0;let aDue=st.due[a.id]||0,bDue=st.due[b.id]||0;let aSeenAndDue=aSeen>0&&aDue<=now,bSeenAndDue=bSeen>0&&bDue<=now;if(aSeenAndDue!==bSeenAndDue)return aSeenAndDue?-1:1;return mastery(a)-mastery(b);}).slice(0,n)}function start(type,n){sess={type,list:type==='study'?adaptive(n):sh(Q).slice(0,n),i:0,right:0};paint()}
function paint(){let q=sess.list[sess.i],v=sess.type==='exam'?'exam':'today';setViewBare(v);let t=document.getElementById(v),order=sh(q.c.map((_,i)=>i));t.innerHTML=`<div class="qbox"><span class="pill">${sess.type==='exam'?'Exam practice':'Adaptive study'} · ${sess.i+1} / ${sess.list.length}</span><div class="muted" style="margin-top:12px">${mn(q.m)}</div><div class="question">${q.q}</div><div class="opts" id="opts"></div><div id="fb"></div></div>`;order.forEach(idx=>{let b=document.createElement('button');b.className='opt';b.textContent=q.c[idx];b.onclick=()=>answer(idx,b,q);opts.appendChild(b)})}function setViewBare(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v?'true':'false'));window.scrollTo(0,0)}
function answer(idx,b,q){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('sel');let ok=idx===q.k;sess.right+=ok?1:0;st.seen[q.id]=(st.seen[q.id]||0)+1;st.correct[q.id]=(st.correct[q.id]||0)+(ok?1:0);st.due[q.id]=Date.now()+(ok?2*DAY:0);save();fb.innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'Correct':'Not yet'}</strong><p>${q.why}</p></div><div class="actions"><button class="btn" id="next">${sess.i===sess.list.length-1?'Finish':'Next'}</button></div>`;next.onclick=()=>{if(++sess.i>=sess.list.length)finish();else paint()}}
function finish(){let p=pct(sess.right,sess.list.length);if(sess.type==='exam')st.exams.push({d:Date.now(),pct:p,n:sess.list.length});else st.sessions.push({d:Date.now(),pct:p,n:sess.list.length});save();let v=sess.type==='exam'?'exam':'today',t=document.getElementById(v);t.innerHTML=`<span class="pill">Session complete</span><h1>${p}%</h1><p class="lead">${p>=85?'Strong result. Keep reviewing due and weak items.':'Use the misses as your next study queue — no need to reread everything.'}</p><div class="actions"><button class="btn" id="home">Back to Today</button><button class="btn ghost" id="again">Run another</button></div>`;home.onclick=()=>setView('today');again.onclick=()=>start(sess.type,sess.list.length)}
function exam(){let best=st.exams.length?Math.max(...st.exams.map(e=>e.pct)):null;document.getElementById('exam').innerHTML=`<h1>Exam practice</h1><p class="lead">Test recall under exam-style conditions. This hosted MVP uses a compact item bank while we validate the interaction and persistence on iPad.</p><div class="card"><div class="muted">Best simulation</div><div class="score">${best==null?'—':best+'%'}</div></div><div class="actions"><button class="btn" id="ex10">10 questions</button><button class="btn ghost" id="ex18">Full current bank · ${Q.length}</button></div>`;ex10.onclick=()=>start('exam',10);ex18.onclick=()=>start('exam',Q.length)}
function progress(){let r=ready(),rows=MODULES.map(m=>{let qs=Q.filter(q=>q.m===m[0]),p=Math.round(qs.reduce((s,q)=>s+mastery(q),0)/qs.length);return `<div class="barline"><span>${m[1]}</span><span class="track"><i style="width:${p}%"></i></span><b>${p}%</b></div>`}).join('');document.getElementById('progress').innerHTML=`<h1>Progress</h1><p class="lead">Measured from answered questions and exam results. Progress is stored in this browser on this device.</p><div class="card"><strong>Readiness · ${r}%</strong>${rows}</div><div class="actions"><button class="btn ghost" id="reset">Reset progress</button></div>`;reset.onclick=()=>{if(confirm('Reset all MeaningLift PSPO progress on this device?')){localStorage.removeItem(KEY);location.reload()}}}
today();
</script>
</body>
</html>
